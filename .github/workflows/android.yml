name: VPN Share Android alpha
on:
  push:
    branches: [main]
    paths:
      - 'Android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Unit tests and installable test APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew test lintDebug assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/VPNShare-Android-0.1.0-alpha.1-test.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VPNShare-Android-0.1.0-alpha.1-test
          path: Android/app/build/outputs/apk/debug/VPNShare-Android-0.1.0-alpha.1-test.apk
          if-no-files-found: error
          retention-days: 14
